name: Android Offline Library Bundle

on:
  push:
    paths:
      - 'android-offline-library-trigger.txt'

permissions:
  contents: read
  issues: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Fetch ephemeral source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(gh api "repos/$GITHUB_REPOSITORY/issues/1" --jq .body)"
          SOURCE_URL="${BODY#SOURCE_URL:}"
          test -n "$SOURCE_URL"
          mkdir -p "$RUNNER_TEMP/ota-src"
          curl -fL --retry 3 "$SOURCE_URL" -o "$RUNNER_TEMP/source.zip"
          unzip -q "$RUNNER_TEMP/source.zip" -d "$RUNNER_TEMP/ota-src"
          SRC_DIR="$(find "$RUNNER_TEMP/ota-src" -name settings.gradle.kts -printf '%h\n' | head -n1)"
          test -n "$SRC_DIR"
          echo "SRC_DIR=$SRC_DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$SRC_DIR" :app:assembleDebug --stacktrace --no-daemon

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          APK="$(find "$SRC_DIR/app/build/outputs/apk/debug" -type f -name '*.apk' | head -n1)"
          test -f "$APK"
          cp "$APK" "$RUNNER_TEMP/out/OllamaTerminalAgent-Android-v3.3.4-debug.apk"
          sha256sum "$RUNNER_TEMP/out/OllamaTerminalAgent-Android-v3.3.4-debug.apk"
          stat -c '%s' "$RUNNER_TEMP/out/OllamaTerminalAgent-Android-v3.3.4-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OllamaTerminalAgent-Android-v3.3.4-debug
          path: ${{ runner.temp }}/out/OllamaTerminalAgent-Android-v3.3.4-debug.apk
          if-no-files-found: error
          retention-days: 1
