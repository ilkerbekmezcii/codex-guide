name: Temporary Ollama Android v3.3.4

on:
  push:
    branches: [main]
    paths:
      - '.ota/ollama-android-v334-source-url.txt'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Download ephemeral source
        shell: bash
        run: |
          set -euo pipefail
          URL="$(cat "$GITHUB_WORKSPACE/.ota/ollama-android-v334-source-url.txt")"
          mkdir -p /tmp/ota-android/src
          curl --fail --location --silent --show-error "$URL" -o /tmp/ota-android/source.zip
          unzip -q /tmp/ota-android/source.zip -d /tmp/ota-android/src
          SRC_DIR="$(find /tmp/ota-android/src -name settings.gradle.kts -printf '%h\n' | head -n1)"
          test -n "$SRC_DIR"
          echo "SRC_DIR=$SRC_DIR" >> "$GITHUB_ENV"
      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$SRC_DIR" :app:assembleDebug --stacktrace --no-daemon
      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ota-android/out
          APK="$(find "$SRC_DIR/app/build/outputs/apk/debug" -type f -name '*.apk' | head -n1)"
          test -f "$APK"
          cp "$APK" /tmp/ota-android/out/OllamaTerminalAgent-Android-v3.3.4-debug.apk
          sha256sum /tmp/ota-android/out/OllamaTerminalAgent-Android-v3.3.4-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OllamaTerminalAgent-Android-v3.3.4-debug
          path: /tmp/ota-android/out/OllamaTerminalAgent-Android-v3.3.4-debug.apk
          if-no-files-found: error
          retention-days: 1
