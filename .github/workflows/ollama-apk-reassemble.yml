name: Temporary Ollama APK Reassemble

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read

jobs:
  reassemble:
    if: github.event.comment.user.login == 'ilkerbekmezcii' && github.event.comment.body == 'BUILD-OLLAMA-APK' && startsWith(github.event.issue.title, '[OLLAMA-APK]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/out
          find .ota/ollama-v335 -maxdepth 1 -type f -name 'part-*.b64' -print | sort | xargs cat | base64 -d > /tmp/out/OllamaTerminalAgent-Android-v3.3.5-debug.apk
          test "$(stat -c '%s' /tmp/out/OllamaTerminalAgent-Android-v3.3.5-debug.apk)" = "10168068"
          sha256sum /tmp/out/OllamaTerminalAgent-Android-v3.3.5-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OllamaTerminalAgent-Android-v3.3.5-debug
          path: /tmp/out/OllamaTerminalAgent-Android-v3.3.5-debug.apk
          if-no-files-found: error
          retention-days: 1
