name: Temporary Adam Hangman Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Adam work
        uses: actions/checkout@v4
        with:
          repository: ilkerbekmezcii/Adam-Asmaca-Oyunu
          ref: work
          path: adam

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build unsigned release
        working-directory: adam
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:clean assembleRelease
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          sha256sum app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload unsigned release
        uses: actions/upload-artifact@v4
        with:
          name: AdamAsmaca-no-redraw-release-unsigned
          path: adam/app/build/outputs/apk/release/app-release-unsigned.apk
          compression-level: 0
          retention-days: 1
