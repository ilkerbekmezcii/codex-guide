name: Temporary Smali Tools

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download smali tools
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 4 -o baksmali.jar https://github.com/JesusFreke/smali/releases/download/v2.5.2/baksmali-2.5.2.jar
          curl -fL --retry 4 -o smali.jar https://github.com/JesusFreke/smali/releases/download/v2.5.2/smali-2.5.2.jar
          java -jar baksmali.jar --version
          java -jar smali.jar --version
      - uses: actions/upload-artifact@v4
        with:
          name: smali-tools
          path: |
            baksmali.jar
            smali.jar
          compression-level: 0
          retention-days: 1
