name: Temporary Toolchain Fetch

on:
  push:
    paths:
      - '.github/workflows/toolchain-fetch.yml'

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Assemble split portable build toolchain
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$RUNNER_TEMP/toolchain"
          OUT="$RUNNER_TEMP/out"
          mkdir -p "$ROOT" "$OUT"

          # Android SDK command-line tools + API 36 build stack
          ANDROID_HOME="$ROOT/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fL --retry 5 --retry-delay 2 \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip \
            -o "$RUNNER_TEMP/android-cli.zip"
          echo '4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  '"$RUNNER_TEMP/android-cli.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/android-cli.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          tar -C "$ROOT" -czf "$OUT/android-sdk.tar.gz" android-sdk

          # Gradle 9.7.1
          curl -fL --retry 5 --retry-delay 2 \
            https://services.gradle.org/distributions/gradle-9.7.1-bin.zip \
            -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$ROOT"
          tar -C "$ROOT" -czf "$OUT/gradle-9.7.1.tar.gz" gradle-9.7.1

          # .NET 10 LTS SDK
          mkdir -p "$ROOT/dotnet"
          curl -fL --retry 5 --retry-delay 2 https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" --version 10.0.400 --install-dir "$ROOT/dotnet" --no-path
          tar -C "$ROOT" -czf "$OUT/dotnet-10.0.400.tar.gz" dotnet

          # Godot 4.7.2 .NET/C# build
          curl -fL --retry 5 --retry-delay 2 \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_linux_x86_64.zip \
            -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$ROOT/godot"
          tar -C "$ROOT" -czf "$OUT/godot-4.7.2-mono.tar.gz" godot

          # Godot .NET export templates are large; split the already-compressed TPZ.
          curl -fL --retry 5 --retry-delay 2 \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_export_templates.tpz \
            -o "$OUT/godot-export-templates.tpz"
          sha256sum "$OUT/godot-export-templates.tpz" > "$OUT/godot-export-templates.tpz.sha256"
          split -b 430M -d -a 2 "$OUT/godot-export-templates.tpz" "$OUT/godot-templates.part-"
          rm "$OUT/godot-export-templates.tpz"

          sha256sum "$OUT/android-sdk.tar.gz" "$OUT/gradle-9.7.1.tar.gz" \
            "$OUT/dotnet-10.0.400.tar.gz" "$OUT/godot-4.7.2-mono.tar.gz" \
            > "$OUT/core.sha256"
          ls -lh "$OUT"

      - name: Upload Android SDK
        uses: actions/upload-artifact@v4
        with:
          name: local-android-sdk
          path: |
            ${{ runner.temp }}/out/android-sdk.tar.gz
            ${{ runner.temp }}/out/core.sha256
          compression-level: 0
          retention-days: 1

      - name: Upload Gradle
        uses: actions/upload-artifact@v4
        with:
          name: local-gradle
          path: ${{ runner.temp }}/out/gradle-9.7.1.tar.gz
          compression-level: 0
          retention-days: 1

      - name: Upload dotnet
        uses: actions/upload-artifact@v4
        with:
          name: local-dotnet
          path: ${{ runner.temp }}/out/dotnet-10.0.400.tar.gz
          compression-level: 0
          retention-days: 1

      - name: Upload Godot engine
        uses: actions/upload-artifact@v4
        with:
          name: local-godot
          path: ${{ runner.temp }}/out/godot-4.7.2-mono.tar.gz
          compression-level: 0
          retention-days: 1

      - name: Upload Godot template checksum
        uses: actions/upload-artifact@v4
        with:
          name: local-godot-template-checksum
          path: ${{ runner.temp }}/out/godot-export-templates.tpz.sha256
          compression-level: 0
          retention-days: 1

      - name: Upload Godot templates part 00
        uses: actions/upload-artifact@v4
        with:
          name: local-godot-templates-00
          path: ${{ runner.temp }}/out/godot-templates.part-00
          compression-level: 0
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload Godot templates part 01
        uses: actions/upload-artifact@v4
        with:
          name: local-godot-templates-01
          path: ${{ runner.temp }}/out/godot-templates.part-01
          compression-level: 0
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload Godot templates part 02
        uses: actions/upload-artifact@v4
        with:
          name: local-godot-templates-02
          path: ${{ runner.temp }}/out/godot-templates.part-02
          compression-level: 0
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload Godot templates part 03
        uses: actions/upload-artifact@v4
        with:
          name: local-godot-templates-03
          path: ${{ runner.temp }}/out/godot-templates.part-03
          compression-level: 0
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload Godot templates part 04
        uses: actions/upload-artifact@v4
        with:
          name: local-godot-templates-04
          path: ${{ runner.temp }}/out/godot-templates.part-04
          compression-level: 0
          retention-days: 1
          if-no-files-found: ignore
