name: Temporary Toolchain Fetch

on:
  push:
    paths:
      - '.github/workflows/toolchain-fetch.yml'

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Assemble split portable build toolchain
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$RUNNER_TEMP/toolchain"
          OUT="$RUNNER_TEMP/out"
          mkdir -p "$ROOT" "$OUT"

          ANDROID_HOME="$ROOT/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fL --retry 5 --retry-delay 2 https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o "$RUNNER_TEMP/android-cli.zip"
          echo '4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  '"$RUNNER_TEMP/android-cli.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/android-cli.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          tar -C "$ROOT" -czf "$OUT/android-sdk.tar.gz" android-sdk

          curl -fL --retry 5 --retry-delay 2 https://services.gradle.org/distributions/gradle-9.7.1-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$ROOT"
          tar -C "$ROOT" -czf "$OUT/gradle-9.7.1.tar.gz" gradle-9.7.1

          sha256sum "$OUT/android-sdk.tar.gz" "$OUT/gradle-9.7.1.tar.gz" > "$OUT/core.sha256"
          ls -lh "$OUT"

      - name: Upload Android SDK
        uses: actions/upload-artifact@v4
        with:
          name: local-android-sdk
          path: |
            ${{ runner.temp }}/out/android-sdk.tar.gz
            ${{ runner.temp }}/out/core.sha256
          compression-level: 0
          retention-days: 1

      - name: Upload Gradle
        uses: actions/upload-artifact@v4
        with:
          name: local-gradle
          path: ${{ runner.temp }}/out/gradle-9.7.1.tar.gz
          compression-level: 0
          retention-days: 1
